name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -h localhost -U postgres -f scripts/db-setup.sql
        env:
          PGPASSWORD: postgres
      - name: Database tools for the backup and restore test
        run: pg_dump --version && pg_restore --version
      - run: pnpm --filter @onpar/rules build
      - run: pnpm typecheck
      - name: Run the tests
        run: set -o pipefail; pnpm test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Say which tests failed
        # Puts the failures on the run's summary page, where they can be read without downloading the log.
        if: failure()
        run: |
          msg=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/test.log" | grep -E -A30 "●|FAIL |error TS" | head -150 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failed tests::${msg:-No test failure lines were found in the log.}"
      - run: pnpm --filter @onpar/web build

  android:
    # The guard phone app. GitHub's machines have the Android SDK, so the app is built here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the phone logic and build the app
        run: set -o pipefail; ./gradlew --no-daemon :core:test :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Say what failed
        # Puts compile errors and failed tests on the run's summary page.
        if: failure()
        run: |
          msg=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/build.log" | grep -E -A6 "^e: |^w: .*error|FAILED|What went wrong|Exception|AssertionFailedError|expected:" | head -150 | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Phone app build::${msg:-No error lines were found in the log.}"
      - name: Keep the app file for download
        uses: actions/upload-artifact@v4
        with:
          name: onpar-phone-app
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  server-package:
    # Builds the hosting package and checks it works end to end: website through the
    # front door, migrations, creating a company, and an encrypted backup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings for a test run
        run: |
          cat > deploy/.env <<ENV
          ONPAR_DOMAIN=localhost:8080
          CADDY_ADDRESS=:80
          HTTP_PORT=8080
          HTTPS_PORT=8443
          COOKIE_SECURE=false
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          ONPAR_OWNER_PASSWORD=$(openssl rand -hex 24)
          ONPAR_APP_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 48)
          DATA_KEY=$(openssl rand -base64 32)
          ENV
          openssl rand -hex 32 > deploy/backup-passphrase
          mkdir -p backups
      - name: Build
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml --profile tools build
      - name: Start and check
        run: |
          C="docker compose --env-file deploy/.env -f deploy/docker-compose.yml"
          $C up -d
          # The website is up at once; the API first runs the database migrations.
          for i in $(seq 1 90); do curl -fs -o /dev/null http://localhost:8080/api/health && break; sleep 2; done
          curl -fs http://localhost:8080/api/health
          curl -fs -o /dev/null http://localhost:8080/login
          # The app must be able to save photos and certificates in its volume.
          $C exec -T api sh -c 'touch /data/uploads/.write-test && rm /data/uploads/.write-test'
          $C exec -T api node dist/db/company-cli.js "CI Guarding" "CI Admin" admin@ci.test | grep "Temporary password"
          $C --profile tools run --rm tools /scripts/backup.sh
          ls backups/onpar-*.tar.enc
      - name: Logs if it failed
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --tail 80
