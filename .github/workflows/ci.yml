name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -h localhost -U postgres -f scripts/db-setup.sql
        env:
          PGPASSWORD: postgres
      - name: Database tools for the backup and restore test
        run: pg_dump --version && pg_restore --version
      - run: pnpm --filter @onpar/rules build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @onpar/web build

  android:
    # The guard phone app. GitHub's machines have the Android SDK, so the app is built here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the phone logic and build the app
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - name: Keep the app file for download
        uses: actions/upload-artifact@v4
        with:
          name: onpar-phone-app
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
